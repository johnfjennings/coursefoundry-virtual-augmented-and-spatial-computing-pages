<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 675 900" width="675" height="900" role="img" aria-labelledby="title desc">
  <title id="title">The Sword of Damocles, 1968</title>
  <desc id="desc">Schematic diagram of Ivan Sutherland's 1968 head-mounted display: a ceiling-mounted support carries a jointed mechanical linkage down to a binocular optical head unit worn on the head, which superimposes a wireframe cube in the wearer's field of view.</desc>

  <defs>
    <style>
      .lbl   { font-family: "Source Sans 3","Source Sans Pro","Segoe UI",system-ui,sans-serif; font-size: 15px; fill: #5a6785; }
      .lblb  { font-family: "Source Sans 3","Source Sans Pro","Segoe UI",system-ui,sans-serif; font-size: 15px; fill: #2563eb; font-weight: 600; }
      .lblw  { font-family: "Source Sans 3","Source Sans Pro","Segoe UI",system-ui,sans-serif; font-size: 15px; fill: #c2570a; font-weight: 600; }
      .ttl   { font-family: "Source Sans 3","Source Sans Pro","Segoe UI",system-ui,sans-serif; font-size: 34px; fill: #0f1f3d; font-weight: 700; letter-spacing: -0.01em; }
      .sub   { font-family: "Source Sans 3","Source Sans Pro","Segoe UI",system-ui,sans-serif; font-size: 18px; fill: #5a6785; }
      .yr    { font-family: "IBM Plex Mono","JetBrains Mono",ui-monospace,monospace; font-size: 17px; fill: #2563eb; font-weight: 600; letter-spacing: 0.08em; }
      .s-ink { fill: none; stroke: #0f1f3d; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .s-thin{ fill: none; stroke: #0f1f3d; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .s-acc { fill: none; stroke: #2563eb; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .s-wire{ fill: none; stroke: #f97316; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .s-lead{ fill: none; stroke: #b9c6e0; stroke-width: 1.4; }
      .s-ray { fill: none; stroke: #2563eb; stroke-width: 1.4; stroke-dasharray: 6 6; opacity: 0.7; }
    </style>
    <pattern id="hatch" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#b9c6e0" stroke-width="2.6"/>
    </pattern>
  </defs>

  <rect width="675" height="900" fill="#f5f8fd"/>
  <rect x="0.75" y="0.75" width="673.5" height="898.5" fill="none" stroke="#dae2f2" stroke-width="1.5"/>

  <!-- ceiling -->
  <rect x="80" y="70" width="515" height="26" fill="url(#hatch)"/>
  <line x1="80" y1="96" x2="595" y2="96" class="s-ink"/>
  <text x="80" y="58" class="lbl">ceiling-mounted support</text>

  <!-- telescoping suspension column with two joints -->
  <line x1="337" y1="96" x2="337" y2="150" class="s-ink"/>
  <rect x="322" y="150" width="30" height="90" rx="4" class="s-thin"/>
  <circle cx="337" cy="240" r="8" fill="#0f1f3d"/>
  <line x1="337" y1="240" x2="337" y2="282" class="s-ink"/>
  <rect x="325" y="282" width="24" height="48" rx="4" class="s-thin"/>
  <circle cx="337" cy="330" r="8" fill="#0f1f3d"/>
  <path d="M337 330 L337 374 L310 402" class="s-ink"/>
  <circle cx="310" cy="402" r="7" fill="#0f1f3d"/>

  <line x1="352" y1="200" x2="470" y2="200" class="s-lead"/>
  <text x="478" y="196" class="lblb">mechanical</text>
  <text x="478" y="214" class="lblb">head tracker</text>

  <!-- head in profile, facing right -->
  <path d="M300 428
           C252 428 228 462 228 502
           C228 534 240 548 240 570
           L240 600
           L296 600
           L296 556
           C326 552 338 534 340 508
           C340 466 326 434 300 428
           Z" class="s-ink"/>
  <path d="M250 470 C284 452 320 456 344 476" class="s-acc"/>

  <!-- binocular optical head unit -->
  <rect x="330" y="474" width="84" height="50" rx="7" class="s-ink"/>
  <line x1="372" y1="474" x2="372" y2="524" class="s-thin"/>
  <rect x="414" y="480" width="32" height="16" rx="3" class="s-acc"/>
  <rect x="414" y="502" width="32" height="16" rx="3" class="s-acc"/>
  <line x1="446" y1="478" x2="470" y2="500" class="s-acc"/>
  <line x1="446" y1="520" x2="470" y2="500" class="s-acc"/>

  <line x1="414" y1="534" x2="414" y2="562" class="s-lead"/>
  <text x="346" y="582" class="lblb">binocular CRT optics</text>

  <!-- rays from the optics toward the virtual image -->
  <line x1="470" y1="500" x2="478" y2="468" class="s-ray"/>
  <line x1="470" y1="500" x2="478" y2="386" class="s-ray"/>

  <!-- wireframe cube: the virtual image -->
  <g>
    <rect x="478" y="382" width="86" height="86" class="s-wire"/>
    <rect x="508" y="352" width="86" height="86" class="s-wire"/>
    <line x1="478" y1="382" x2="508" y2="352" class="s-wire"/>
    <line x1="564" y1="382" x2="594" y2="352" class="s-wire"/>
    <line x1="564" y1="468" x2="594" y2="438" class="s-wire"/>
    <line x1="478" y1="468" x2="508" y2="438" class="s-wire"/>
  </g>
  <text x="478" y="334" class="lblw">wireframe image</text>

  <!-- caption -->
  <line x1="80" y1="782" x2="595" y2="782" stroke="#dae2f2" stroke-width="1.5"/>
  <text x="80" y="816" class="yr">1968</text>
  <text x="80" y="852" class="ttl">Sword of Damocles</text>
  <text x="80" y="878" class="sub">Ivan Sutherland's first head-mounted display</text>
</svg>
